<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>쨈미나이 관리자 센터</title><link rel="stylesheet" href="/static/admin.css"></head>
<body><div class="shell" id="app" data-csrf="{{ csrf }}"><aside class="side"><h1>☾ 쨈미나이</h1><p>길드 관리자 센터</p><nav><button data-page="ranking" class="active">🏆 통화 랭킹</button><button data-page="daily">📅 요일별 기록</button><button data-page="roster">👥 길드원 명부</button><button data-page="notice">📢 공지 발송</button></nav><div class="side-bottom"><span>로그인: {{ user }}</span><button id="logout">로그아웃</button></div></aside>
<main><header><div><h2 id="page-title">주간 통화 랭킹</h2><p id="last-updated">서버 연결 중</p></div><button id="refresh" class="primary">↻ 새로고침</button></header><div id="alert" role="status" aria-live="polite"></div><section id="summary" class="summary"></section><section class="panel" id="table-panel"><div class="scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div></section><section class="panel hidden" id="notice-panel"><h3>공지사항 작성</h3><label>제목<input id="notice-title" maxlength="100" placeholder="공지 제목"></label><label>내용<textarea id="notice-content" maxlength="1700" rows="9" placeholder="공지 내용을 입력하세요"></textarea></label><label class="check"><input type="checkbox" id="mention-everyone"> 맨 아래에 @everyone 추가</label><button class="primary" id="send-notice">공지 발송</button></section></main></div>
<dialog id="member-dialog"><form method="dialog"><div class="dialog-head"><h3 id="dialog-title">길드원 관리</h3><button aria-label="닫기" class="plain">✕</button></div></form><div id="member-content"></div><div class="actions"><button data-action="warn_add">경고 1회</button><button data-action="exempt_add">휴가 등록</button><button data-action="exempt_remove">휴가 해제</button><button data-action="goal_set">주간 목표 조정</button></div></dialog>
<script src="/static/admin.js" defer></script></body></html>
